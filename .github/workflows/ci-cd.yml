name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --group dev

      - name: Run linter
        working-directory: backend
        run: uv run ruff check .

      - name: Run tests
        working-directory: backend
        run: uv run pytest -v || true

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: bun run type-check

  build-and-push:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
      packages: write
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Backend Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Frontend Metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate Runtime Env File
        run: |
          mkdir -p backend
          cat <<EOF > backend/.env.production
          ENV=PROD
          DB_URL=${{ secrets.PRODUCTION_DB_URL }}
          REDIS_URL=redis://redis:6379/0
          JWT_SECRET_KEY=${{ secrets.PRODUCTION_JWT_SECRET_KEY }}
          BILIBILI_SESSDATA=${{ secrets.PRODUCTION_BILIBILI_SESSDATA }}
          YOUTUBE_API_KEYS=${{ secrets.PRODUCTION_YOUTUBE_API_KEYS }}
          CORS_ORIGINS=${{ secrets.PRODUCTION_CORS_ORIGINS }}
          SUPERADMIN_USERNAME=${{ secrets.PRODUCTION_SUPERADMIN_USERNAME }}
          SUPERADMIN_PASSWORD=${{ secrets.PRODUCTION_SUPERADMIN_PASSWORD }}
          EOF

      - name: Set output
        id: outputs
        run: |
          echo "tags=${{ steps.meta.outputs.tags }}" >> $GITHUB_OUTPUT
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Create deployment tag
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "DEPLOY_TAG=${{ github.sha }}" >> $GITHUB_ENV
          echo "DEPLOY_SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Set up SSH
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare deployment directory
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "mkdir -p ${{ env.DEPLOY_DIR }}"

      - name: Copy deployment files
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          scp docker-compose.prod.yml ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.DEPLOY_DIR }}/
          scp backend/.env.production ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.DEPLOY_DIR }}/backend/

      - name: Pull images
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "cd ${{ env.DEPLOY_DIR }} && \
            IMAGE_TAG=${{ github.sha }} \
            IMAGE_OWNER=${{ github.repository_owner | downcase }} \
            docker compose -f docker-compose.prod.yml pull"

      - name: Deploy with Docker Compose
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "cd ${{ env.DEPLOY_DIR }} && \
            IMAGE_TAG=${{ github.sha }} \
            IMAGE_OWNER=${{ github.repository_owner | downcase }} \
            docker compose -f docker-compose.prod.yml up -d"

      - name: Health check
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          sleep 10
          curl -f https://${{ env.SERVER_HOST }}/health || exit 1

      - name: Cleanup old images
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "docker image prune -f"